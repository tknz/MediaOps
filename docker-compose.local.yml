services:
  app:
    image: mediaops-app
    build: .
    container_name: mediaops-local
    env_file: .env.local
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./config:/config
      - ./config/art-cache:/config/art-cache
      - /tmp/plex-seerr-analysis/tautulli.db:/imports/tautulli.db:ro
      - /tmp/plex-seerr-analysis/seerr.db:/imports/seerr.db:ro
      - /tmp/plex-seerr-analysis/radarr.db:/imports/radarr.db:ro
      - /tmp/plex-seerr-analysis/sonarr.db:/imports/sonarr.db:ro
  db:
    image: postgres:16-alpine
    container_name: mediaops-db-local
    environment:
      POSTGRES_DB: mediaops
      POSTGRES_USER: mediaops
      POSTGRES_PASSWORD: mediaops
    volumes:
      - mediaops_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediaops -d mediaops"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mediaops_pg:
